name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZIP_URL: https://downloads.miguelhx.com/MMTranscripts.zip
  MM_RAW: data/raw

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false

      - id: etag
        run: |
          etag=$(curl -sfI "$ZIP_URL" | tr -d '\r' | awk -F': ' 'tolower($1)=="etag"{print $2}' | tr -d '"')
          echo "etag=${etag:-none}" >> "$GITHUB_OUTPUT"

      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # The daily run only rebuilds when the zip changed since the deployed build.
      - id: check
        if: github.event_name == 'schedule'
        env:
          ETAG: ${{ steps.etag.outputs.etag }}
          SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          live=$(curl -sf "$SITE/source.json" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("etag") or "").strip("\""))' || true)
          if [ -n "$live" ] && [ "$live" = "$ETAG" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "unchanged: $ETAG"; fi

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.check.outputs.skip != 'true'
        with:
          path: data/raw
          key: mmzip-${{ steps.etag.outputs.etag }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Fetch, build records and site
        if: steps.check.outputs.skip != 'true'
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: |
          make fetch
          make site
          du -sh dist
          find dist -type f -size +100M -print -exec false {} +

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.check.outputs.skip != 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
